<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#a9b0a2" />
    <title>PIXELGRAPHY</title>
    <link rel="icon" href="icon.png" />
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <!-- 配色要在内容之前加载，避免闪一下默认配色 -->
    <script src="theme.js"></script>
    <script src="lib/p5.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>PIXELGRAPHY</h1>
        <div id="theme-row" aria-label="配色 Theme"></div>
      </header>

      <section class="pixeldraw">
        <div id="p5-canvas-container"></div>

        <div id="tools">
          <div class="tool-row">
            <button class="nes-btn tool-active" id="brush-btn" onclick="setBrush()">画笔 Brush</button>
            <button class="nes-btn" id="eraser-btn" onclick="setEraser()">橡皮擦 Eraser</button>
            <button class="nes-btn" onclick="setUndo()">撤销 Undo</button>
            <button class="nes-btn" onclick="setClear()">清空 Clear</button>
          </div>
          <div class="tool-row">
            <input id="text-input" class="nes-input" type="text" placeholder="输入文字，用字来画 / type to draw with words" />
          </div>
          <div class="tool-row">
            <label class="bg-label"><input type="checkbox" id="bg-toggle" checked /> 带底色 Background</label>
            <button class="nes-btn" onclick="savePNG()">保存 Save PNG</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
