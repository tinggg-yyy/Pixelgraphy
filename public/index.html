<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#a9b0a2" />
    <title>PIXELGRAPHY</title>
    <link rel="icon" href="icon.png" />
    <!-- iPhone「添加到主屏幕」只认 apple-touch-icon，没有就用网址首字母当图标 -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="PIXELGRAPHY" />
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <!-- 配色要在内容之前加载，避免闪一下默认配色 -->
    <script src="theme.js"></script>
    <script src="lib/p5.js"></script>
    <script src="filters.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>PIXELGRAPHY</h1>
        <div class="header-right">
          <label class="bg-label"><span data-zh="像素" data-en="Pixels"></span>
            <input id="grid-size" class="nes-input small-input" type="number" min="4" max="128" step="1" inputmode="numeric" />
          </label>
          <button class="nes-btn lang-btn" id="lang-btn" onclick="toggleLang()"></button>
        </div>
      </header>

      <!-- 手机竖屏：从上到下排；电脑 / iPad 横屏：左栏 · 画布 · 右栏 -->
      <section class="pixeldraw">
        <aside id="left-panel">
          <!-- 配色、阴影、滤镜都是按钮，点开是浮在页面上的面板（面板相对这一行定位） -->
          <div id="style-row">
            <div id="theme-row" data-zh-aria="配色" data-en-aria="Theme"></div>
            <button class="nes-btn pop-btn" id="shadow-btn" onclick="toggleShadowPop()" aria-expanded="false">
              <span class="swatch" id="shadow-preview"></span><span data-zh="阴影" data-en="Shadow"></span><span class="caret">▾</span>
            </button>
            <div id="shadow-panel" class="pop-panel" hidden>
              <span class="bg-label shadow-title" data-zh="阴影" data-en="Shadow"></span>
              <button class="nes-btn small-btn" onclick="resetShadow()" data-zh="重置" data-en="Reset"></button>
              <label class="bg-label"><span data-zh="颜色" data-en="Color"></span>
                <input id="shadow-color" type="color" class="color-input" />
              </label>
              <label class="bg-label"><span data-zh="透明度" data-en="Opacity"></span>
                <input id="shadow-alpha" type="range" min="0" max="1" step="0.05" />
              </label>
              <label class="bg-label"><span data-zh="左右" data-en="X"></span>
                <input id="shadow-x" type="range" min="-0.5" max="0.5" step="0.05" />
              </label>
              <label class="bg-label"><span data-zh="上下" data-en="Y"></span>
                <input id="shadow-y" type="range" min="-0.5" max="0.5" step="0.05" />
              </label>
            </div>
            <!-- 滤镜：屏幕上只作用在画框里，导出时覆盖整张图；闪粉、故障是叠加在上面的，可以和任何滤镜一起开 -->
            <button class="nes-btn pop-btn" id="filter-btn" onclick="toggleFilterPop()" aria-expanded="false">
              <span id="filter-name"></span><span class="caret">▾</span>
            </button>
            <div id="filter-panel" class="pop-panel" hidden></div>
          </div>
        </aside>

        <div id="canvas-col">
          <div id="p5-canvas-container"></div>
        </div>

        <div id="tools">
          <div class="tool-row">
            <button class="nes-btn tool-active" id="brush-btn" onclick="setBrush()" data-zh="画笔" data-en="Brush"></button>
            <button class="nes-btn" id="eraser-btn" onclick="setEraser()" data-zh="橡皮擦" data-en="Eraser"></button>
            <button class="nes-btn" onclick="setUndo()" data-zh="撤销" data-en="Undo"></button>
            <button class="nes-btn" onclick="setClear()" data-zh="清空" data-en="Clear"></button>
          </div>
          <div class="tool-row">
            <input id="text-input" class="nes-input" type="text" data-zh-placeholder="用字来画" data-en-placeholder="Draw with words" />
          </div>
          <div class="tool-row">
            <label class="bg-label"><span data-zh="样式" data-en="Style"></span>
              <select id="export-style" class="nes-input small-input">
                <option value="plain" data-zh="纯色底" data-en="Plain"></option>
                <option value="framed" data-zh="带框格子" data-en="Framed"></option>
                <option value="transparent" data-zh="透明底" data-en="Transparent"></option>
                <option value="framed-clear" data-zh="带框透明底" data-en="Framed Transparent"></option>
              </select>
            </label>
            <label class="bg-label"><span data-zh="格式" data-en="Format"></span>
              <select id="export-format" class="nes-input small-input">
                <option value="png">PNG</option>
                <option value="jpg">JPG</option>
                <option value="webp">WEBP</option>
              </select>
            </label>
            <button class="nes-btn" onclick="saveImage()" data-zh="保存" data-en="Save"></button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
